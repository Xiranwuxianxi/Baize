name: Desktop packages

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest }
          - { name: linux-x64, os: ubuntu-22.04 }
          - { name: macos-arm64, os: macos-latest }
          - { name: macos-x64, os: macos-15-intel }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            frontend/package-lock.json
      - run: python -m pip install -r desktop/requirements-build.txt
      - run: npm ci --prefix desktop --no-fund --no-audit
      - run: npm run check --prefix desktop
      - name: Build desktop packages
        run: npm run build --prefix desktop
        env:
          BAIZE_BUILD_PYTHON: python
      - name: Smoke test (Windows and macOS)
        if: runner.os != 'Linux'
        run: npm run smoke --prefix desktop
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run smoke --prefix desktop
      - name: Smoke test the Windows portable launcher with inherited package ACLs
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $portableTemp = Join-Path $env:RUNNER_TEMP 'baize-portable-acl-test'
          New-Item -ItemType Directory -Path $portableTemp | Out-Null
          $acl = Get-Acl -LiteralPath $portableTemp
          $acl.SetAccessRuleProtection($true, $true)
          foreach ($rule in @($acl.Access)) {
            $sid = $rule.IdentityReference.Translate([System.Security.Principal.SecurityIdentifier]).Value
            if ($sid -in @('S-1-15-2-1', 'S-1-15-2-2')) { $acl.RemoveAccessRuleSpecific($rule) }
          }
          $packageSid = [System.Security.Principal.SecurityIdentifier]::new('S-1-15-2-123456789-234567890-345678901-456789012-567890123-678901234-789012345')
          $acl.AddAccessRule([System.Security.AccessControl.FileSystemAccessRule]::new($packageSid, 'ReadAndExecute', 'ContainerInherit,ObjectInherit', 'None', 'Allow'))
          Set-Acl -LiteralPath $portableTemp -AclObject $acl
          $env:TEMP = $portableTemp
          $env:TMP = $portableTemp
          $env:BAIZE_SMOKE_EXECUTABLE = (Resolve-Path 'release/*-portable.exe').Path
          npm run smoke --prefix desktop
      - name: Inspect packaged files
        run: node desktop/audit.cjs
      - name: Verify build outputs stay out of Git
        run: python -c "import subprocess; out = subprocess.check_output(['git', 'status', '--porcelain', '--untracked-files=all'], text=True); assert not out.strip(), out"
      - name: Upload installers only
        uses: actions/upload-artifact@v4
        with:
          name: Baize-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 30
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
