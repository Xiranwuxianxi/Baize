name: Desktop packages

on:
  workflow_dispatch:
    inputs:
      update_type:
        description: '更新类型：small 小更新（末位 +1，9 后进位）；big 大更新（首位 +1，其余归零）'
        type: choice
        options: [small, big]
        required: true
      base_version:
        description: '上一批打包版本号，例如 1.0.1；重试同一批次时保持原值'
        type: string
        required: true

permissions:
  contents: read

jobs:
  prepare:
    name: Select version and build time
    runs-on: ubuntu-latest
    outputs:
      base_version: ${{ steps.release.outputs.base_version }}
      version: ${{ steps.release.outputs.version }}
      timestamp: ${{ steps.release.outputs.timestamp }}
      folder: ${{ steps.release.outputs.folder }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Calculate the selected update
        id: release
        run: node desktop/prepare-release.cjs
        env:
          BAIZE_UPDATE_TYPE: ${{ inputs.update_type }}
          BAIZE_BASE_VERSION: ${{ inputs.base_version }}

  package:
    name: ${{ matrix.name }}
    needs: prepare
    env:
      BAIZE_UPDATE_TYPE: ${{ inputs.update_type }}
      BAIZE_BASE_VERSION: ${{ needs.prepare.outputs.base_version }}
      BAIZE_BUILD_VERSION: ${{ needs.prepare.outputs.version }}
      BAIZE_BUILD_TIMESTAMP: ${{ needs.prepare.outputs.timestamp }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest }
          - { name: linux-x64, os: ubuntu-22.04 }
          - { name: macos-arm64, os: macos-latest }
          - { name: macos-x64, os: macos-15-intel }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            frontend/package-lock.json
      - run: python -m pip install -r desktop/requirements-build.txt
      - run: npm ci --prefix desktop --no-fund --no-audit
      - run: npm run check --prefix desktop
      - name: Build desktop packages
        run: npm run build --prefix desktop
        env:
          BAIZE_BUILD_PYTHON: python
      - name: Smoke test (Windows and macOS)
        if: runner.os != 'Linux'
        run: npm run smoke --prefix desktop
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run smoke --prefix desktop
      - name: Install and launch each final package (Windows and macOS)
        if: runner.os != 'Linux'
        run: node desktop/test-packages.cjs
      - name: Install and launch each final package (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node desktop/test-packages.cjs
      - name: Inspect packaged files
        run: node desktop/audit.cjs
      - name: Verify build outputs stay out of Git
        run: python -c "import subprocess; out = subprocess.check_output(['git', 'status', '--porcelain', '--untracked-files=all'], text=True); assert not out.strip(), out"
      - name: Upload installers only
        uses: actions/upload-artifact@v4
        with:
          name: Baize-${{ matrix.name }}-${{ needs.prepare.outputs.version }}_${{ needs.prepare.outputs.timestamp }}
          if-no-files-found: error
          retention-days: 30
          path: |
            release/${{ needs.prepare.outputs.folder }}/*.exe
            release/${{ needs.prepare.outputs.folder }}/*.dmg
            release/${{ needs.prepare.outputs.folder }}/*.zip
            release/${{ needs.prepare.outputs.folder }}/*.AppImage
            release/${{ needs.prepare.outputs.folder }}/*.deb
            release/${{ needs.prepare.outputs.folder }}/BUILD.json
