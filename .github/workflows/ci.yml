name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    # 三个系统都真跑一遍：数据目录、命令行（bash / PowerShell）、打开文件等都有按系统区分的代码
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.13"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r backend/requirements-dev.txt
      - name: Lint (undefined names, unused imports)
        run: python -m pyflakes backend/*.py tests/unit
      - name: Import the app
        run: python -c "import main; print(len(main.app.routes), 'routes')"
        working-directory: backend
        env:
          MAC_DATA_DIR: ${{ runner.temp }}/mac-data
      - name: Unit tests (offline, no model needed)
        run: python -m pytest tests/unit -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Lint (ESLint + React Hooks)
        run: npm run lint
        working-directory: frontend
      - name: Type check (TypeScript)
        run: npm run typecheck
        working-directory: frontend
      - name: Unit tests (Vitest)
        run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t baize:ci .
      - name: Start container and wait until healthy
        run: |
          docker run -d --name mac -p 18760:18760 baize:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18760/api/state > /dev/null; then exit 0; fi
            sleep 1
          done
          docker logs mac
          exit 1

# The end-to-end checks in tests/ talk to real model services (a local Ollama),
# so they are run by contributors locally rather than in CI.
