# docker compose up -d --build
# 打开 http://localhost:18760
#
# 关于本地操作：容器里的智能体只能操作容器内的环境和下面挂载的 ./workspace，
# 管不了宿主机。想让智能体管理宿主机本身，请不要用 Docker，直接运行 python run.py。
services:
  mac:
    build: .
    image: baize:latest
    container_name: baize
    restart: unless-stopped
    ports:
      - "18760:18760"          # 只想本机访问可改成 "127.0.0.1:18760:18760"
    environment:
      MAC_TOKEN: ${MAC_TOKEN:-}                    # 访问口令；开启本地操作时必须设置
      MAC_LOCAL_ACCESS: ${MAC_LOCAL_ACCESS:-0}     # 设为 1 开启容器内的本地操作
      # 模型密钥：在渠道的 API Key 里写 env:变量名 来引用
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
    volumes:
      - mac-data:/data                             # 数据库（Docker 卷，不在项目文件夹里）
      - mac-workspace:/workspace                   # 智能体可以读写的目录（想在宿主机上直接看，改成 /你的目录:/workspace）
      # - /你的目录/config.yaml:/config/config.yaml:ro   # 需要配置文件时再挂进来
    extra_hosts:
      - "host.docker.internal:host-gateway"        # 让容器能访问宿主机上的 Ollama 等服务

volumes:
  mac-data:
  mac-workspace:
